# dpetoos ayarlari
# Arayuzde ayar yok - her sey burada. Degistirdikten sonra dpetoos'yu yeniden baslat.
# Ilk acilis varsayilanlari sahte TCP paketi gondermez; once guvenli bolme kullanir.
# Hattina en uygun daha guclu ayari bulmak icin dpetoos-tune calistirabilirsin.

# ---------------------------------------------------------------- desync kipi
# fake+disorder : sahte paket + alan adinin ortasindan bolup ters sirada gonder (en guclu)
# fake+split    : sahte paket + normal sirada bol
# disorder      : yalnizca ters sirali bolme
# split         : yalnizca bolme
# off           : dokunma
tls  = disorder
http = disorder

# QUIC (UDP/443, HTTP/3):
#   fake  -> sahte bir Initial gonder, gercegini de yolla (QUIC hizi korunur)
#   drop  -> Initial'i dusur, tarayici aninda TCP+TLS'e gecer (en uyumlu)
#   off   -> hic dokunma
quic = fake

# ------------------------------------------------------------- bolme konumu
# host   : alan adinin ilk harfinden hemen sonra - varsayilan
# midsld : alan adinin ana etiketinin ortasi (ornek: you|tube.com)
# <sayi> : sabit bayt konumu (ornek: 2)
split_pos = host

# --------------------------------------------------------- sahte TCP paketi
# Sahte paketin sunucuya ULASMAMASI gerekir, yoksa baglantiyi bozar.
# Bunu saglamanin uc yolu var:
#
# fake_wrongseq : pencere disi sira numarasi. Sunucu "eski veri" deyip atar.
#                 En guvenlisi ve checksum dogrulayan DPI'lara karsi da calisir.
# fake_badsum   : bozuk TCP checksum. Bazi ag kartlari checksum'i donanimda
#                 yeniden hesaplayip "duzelttigi" icin her hatta calismaz -
#                 calismadiginda baglantiyi bozar. Varsayilan kapali.
# fake_ttl      : dusuk TTL. DPI kutusunu gecer ama sunucuya varmadan olmeli.
#                 Deger hedeften uzaksa sahte paket sunucuya ULASIR ve bozar.
#                 Hatta gore ayarlanmali, o yuzden varsayilan kapali.
#
# Hangisinin senin hattinda calistigini bilmiyorsan tahmin etme, olctur:
#   bin\dpetoos-tune.exe discord.com
fake_wrongseq  = false
fake_badsum    = false
fake_ttl       = false
fake_ttl_value = 4
fake_count     = 1

# Sahte paketin icindeki zararsiz alan adi.
fake_sni = www.iana.org

# HTTP "Host:" basligini "hOsT:" yapar. RFC uyumlu ama bazi eski sunucular
# huysuzlanabilir; varsayilan kapali.
http_host_case = false

# --------------------------------------------------------------------- kapsam
enable_tls    = true
enable_http   = true
enable_ipv6   = true
# Yerel ag / modem arayuzu / loopback hedeflerine hic dokunma:
skip_private  = true

# -------------------------------------------------------------------- basarim
# threads = 0 -> cekirdek sayisina gore otomatik (en fazla 4)
threads       = 0
# Surucu kuyrugu: yuksek degerler ani yogunlukta paket dusmesini engeller.
queue_length  = 16384
queue_time    = 2000
queue_size    = 33554432
# Surec onceligini yukseltir. Paket is parcaciklari zaten Highest onceliginde,
# bu ayar tum sureci (arayuz dahil) yukseltir - oyun oynarken kapali kalsin.
high_priority = false

# ------------------------------------------------------------------- arayuz
auto_start       = true
minimize_to_tray = true
